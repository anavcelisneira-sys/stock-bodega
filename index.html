<script>
/* ─────────── Persistencia ───────────
   Dentro de Claude usa window.storage. Si publicás este archivo en tu propio
   hosting (GitHub Pages, Drive, etc.) reemplazá el cuerpo de load/save por:
     load: JSON.parse(localStorage.getItem(k) || 'null')
     save: localStorage.setItem(k, JSON.stringify(v))
────────────────────────────────────── */
async function load(k){
  try{ return JSON.parse(localStorage.getItem(k) || 'null'); }catch(e){ return null; }
}
async function save(k,v){
  try{ localStorage.setItem(k, JSON.stringify(v)); }
  catch(e){ alert('No se pudo guardar: el almacenamiento del telefono esta lleno.'); }
}

const K_PROD='inv:productos', K_MOV='inv:movimientos', K_CFG='inv:config', K_STOCK='inv:stock';
/* stockBase guarda el stock que dice la hoja RESUMEN y cuando se trajo.
   El numero que ve la persona es ese, mas lo que cargo en el telefono y
   todavia no subio. Sin esto, la app mostraba solo lo cargado en este
   telefono y nunca coincidia con la bodega. */
let stockBase = {ts:null, datos:{}};

/* ─────────── Fotos ───────────
   Van en IndexedDB, no en el almacenamiento comun: una foto pesa mucho mas que
   un movimiento y ahi hay espacio de sobra. En memoria queda solo la miniatura
   que se esta mostrando. */
let bd = null, fotoCache = {};

function abrirBD(){
  return new Promise((ok, mal)=>{
    if(bd) return ok(bd);
    const req = indexedDB.open('inv-fotos', 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore('fotos');
    req.onsuccess = ()=>{ bd = req.result; ok(bd); };
    req.onerror = ()=> mal(req.error);
  });
}
async function guardarFoto(sku, dataUrl){
  const db = await abrirBD();
  return new Promise((ok, mal)=>{
    const t = db.transaction('fotos','readwrite');
    t.objectStore('fotos').put(dataUrl, sku);
    t.oncomplete = ()=>{ fotoCache[sku] = dataUrl; ok(true); };
    t.onerror = ()=> mal(t.error);
  });
}
async function traerFoto(sku){
  if(sku in fotoCache) return fotoCache[sku];
  try{
    const db = await abrirBD();
    const dato = await new Promise((ok, mal)=>{
      const r = db.transaction('fotos').objectStore('fotos').get(sku);
      r.onsuccess = ()=> ok(r.result || null);
      r.onerror = ()=> mal(r.error);
    });
    fotoCache[sku] = dato;
    return dato;
  }catch(e){ return null; }
}
async function borrarFoto(sku){
  try{
    const db = await abrirBD();
    db.transaction('fotos','readwrite').objectStore('fotos').delete(sku);
    delete fotoCache[sku];
  }catch(e){}
}
async function precargarFotos(){
  try{
    const db = await abrirBD();
    const claves = await new Promise((ok,mal)=>{
      const r = db.transaction('fotos').objectStore('fotos').getAllKeys();
      r.onsuccess = ()=> ok(r.result||[]); r.onerror = ()=> mal(r.error);
    });
    for(const k of claves) await traerFoto(k);
  }catch(e){}
}

/* Reduce la foto antes de guardarla: 700 px de lado mayor y JPEG al 72%.
   Una foto de camara pasa de ~4 MB a ~70 KB, que es lo que hace viable
   tener cientos de piezas en el telefono y subirlas sin esperar. */
function reducir(file, lado){
  return new Promise((ok, mal)=>{
    const fr = new FileReader();
    fr.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const esc = Math.min(1, lado / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * esc);
        c.height = Math.round(img.height * esc);
        const cx = c.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0,0,c.width,c.height);
        cx.drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = ()=> mal(new Error('No se pudo leer la imagen'));
      img.src = fr.result;
    };
    fr.onerror = ()=> mal(new Error('No se pudo abrir el archivo'));
    fr.readAsDataURL(file);
  });
}

function thumb(sku, clase){
  const f = fotoCache[sku];
  return f
    ? `<img class="thumb ${clase||''}" src="${f}" alt="">`
    : `<div class="thumb sinfoto ${clase||''}">◇</div>`;
}
let cfg = {url:'', token:'', ultima:null};
let productos=[], movs=[], tab='escanear', scanner=null, scanning=false;
let sesion=[], movVista='prod', movPeriodo='hoy', prodVista='galeria';

const MOTIVOS = {
  entrada:['Recepción proveedor','Producción laboratorio','Devolución BARREAU','Devolución DROPI','Ajuste de inventario','Carga inicial'],
  salida:['Despacho BARREAU','Despacho DROPI','Traslado a laboratorio','Merma / rotura','Muestra','Ajuste de inventario']
};

const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const bySku = sku => productos.find(p=>p.sku===sku);

function pendientesDe(sku){
  return movs.reduce((t,m)=>{
    if(m.sku!==sku || m.sync) return t;
    return t + (m.tipo==='entrada' ? m.cant : -m.cant);
  }, 0);
}
function stockPlanilla(sku){
  const v = stockBase.datos[sku];
  return v === undefined ? null : v;
}
function stock(sku){
  const base = stockPlanilla(sku);
  if(base === null){
    // Todavia no se trajo el stock: se muestra solo lo cargado en este telefono
    return movs.reduce((t,m)=> m.sku===sku ? t + (m.tipo==='entrada'? m.cant : -m.cant) : t, 0);
  }
  return base + pendientesDe(sku);
}
function hayBase(){ return !!stockBase.ts; }
function haceCuanto(){
  if(!stockBase.ts) return 'nunca';
  const min = Math.round((Date.now()-stockBase.ts)/60000);
  if(min < 1) return 'recién';
  if(min < 60) return `hace ${min} min`;
  const hs = Math.round(min/60);
  if(hs < 24) return `hace ${hs} h`;
  const d = fecha(stockBase.ts);
  return `el ${d.f}`;
}

function estado(p){
  const s = stock(p.sku);
  if(s<=0) return {cls:'zero',txt:'Sin stock',s};
  if(s<=Number(p.min||0)) return {cls:'low',txt:'Bajo mínimo',s};
  return {cls:'ok',txt:'OK',s};
}
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.hidden=false;
  clearTimeout(t._t); t._t=setTimeout(()=>t.hidden=true,2600);
}
function fecha(ts){
  const d=new Date(ts), p=n=>String(n).padStart(2,'0');
  return {f:`${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`, h:`${p(d.getHours())}:${p(d.getMinutes())}`};
}

/* ─────────── Navegación ─────────── */
document.querySelectorAll('.tabs button').forEach(b=>{
  b.onclick = ()=>{ tab=b.dataset.tab; render(); };
});

function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-current', b.dataset.tab===tab));
  const bajo = productos.filter(p=>estado(p).cls!=='ok').length;
  $('#headStat').innerHTML = productos.length
    ? `<span class="num">${productos.length}</span> productos · <span class="num">${bajo}</span> en alerta`
    : '';
  if(tab!=='escanear') stopScan();
  ({escanear:vEscanear, stock:vStock, movs:vMovs, prod:vProd, sheets:vSheets}[tab])();
}

/* ─────────── Escanear ─────────── */
function vEscanear(){
  $('#view').innerHTML = `
    <div class="panel">
      <h2>Escanear código de barras</h2>
      <div id="reader"></div>
      <div class="row" style="margin-top:12px">
        <button id="btnScan" class="big in">Encender cámara</button>
      </div>
      <p class="muted" style="margin:10px 0 0">Si la cámara no abre acá, la app tiene que estar publicada en una dirección https propia. Igual podés cargar todo a mano.</p>
    </div>
    ${panelSesion()}
    <div class="panel">
      <h2>Buscar a mano</h2>
      <p class="muted" style="margin:-4px 0 8px">Para los productos que todavía no tienen etiqueta.</p>
      <input id="q" placeholder="Nombre, SKU o código" autocomplete="off">
      <div id="res"></div>
    </div>`;
  $('#btnScan').onclick = ()=> scanning ? stopScan(true) : startScan();
  wireSesion();
  $('#q').oninput = e=>{
    const q=e.target.value.trim().toLowerCase();
    const r=$('#res');
    if(!q){ r.innerHTML=''; return; }
    const hits = productos.filter(p =>
      p.nombre.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q) ||
      (p.codigos||[]).some(c=>c.includes(q))
    ).slice(0,8);
    r.innerHTML = hits.length
      ? hits.map(p=>{const e=estado(p);return `
          <div class="item"><span class="dot ${e.cls}"></span>${thumb(p.sku)}
            <div class="grow"><div class="name">${esc(p.nombre)}${p.unica?' <span class="unica">única</span>':''}</div><div class="sub">${esc(p.sku)} · ${e.s} ${esc(p.unidad||'un')}</div></div>
            <button data-mov="${esc(p.sku)}">Mover</button>
          </div>`}).join('')
      : `<p class="empty">Sin resultados. Cargalo en Productos.</p>`;
    r.querySelectorAll('[data-mov]').forEach(b=> b.onclick=()=>openMov(b.dataset.mov));
  };
}

/* ─────────── Acumulado de la sesión ─────────── */
function itemsSesion(){
  return sesion.map(id=>movs.find(m=>m.id===id)).filter(Boolean);
}
function agrupar(lista){
  const map = new Map();
  lista.forEach(m=>{
    const k = m.sku+'|'+m.tipo+'|'+(m.lote||'');          // cada lote cuenta aparte
    if(!map.has(k)) map.set(k, {sku:m.sku, tipo:m.tipo, lote:m.lote||'', cant:0, veces:0});
    const g = map.get(k); g.cant += m.cant; g.veces++;
  });
  return [...map.values()];
}
function panelSesion(){
  const items = itemsSesion();
  if(!items.length) return `
    <div class="panel">
      <h2>Escaneados en esta tanda</h2>
      <p class="empty">Acá se va armando la lista de lo que cargues, con el total acumulado por producto.</p>
    </div>`;
  const g = agrupar(items);
  const unidades = items.reduce((t,m)=>t+m.cant,0);
  return `
    <div class="panel">
      <h2>Escaneados en esta tanda</h2>
      ${g.map(x=>{
        const p=bySku(x.sku), b=Math.max(1,+p?.bulto||1);
        const col = x.tipo==='entrada'?'var(--entrada)':'var(--salida)';
        return `<div class="item">
          <div class="grow"><div class="name">${esc(p?p.nombre:x.sku)}</div>
            <div class="sub">${x.tipo==='entrada'?'Entrada':'Salida'}${x.lote?` · lote ${esc(x.lote)}`:''} · ${x.veces} carga${x.veces>1?'s':''}${b>1?` · ${(x.cant/b).toFixed(x.cant%b?2:0)} bultos`:''}</div></div>
          <div><div class="qty" style="color:${col}">${x.tipo==='entrada'?'+':'−'}${x.cant}</div>
            <div class="sub" style="text-align:right">${esc(p?.unidad||'un')}</div></div>
        </div>`}).join('')}
      <div class="totalbox" style="border-top:1px solid var(--line);padding-top:11px;margin-top:2px">
        <strong>${g.length}</strong> productos · <strong>${unidades}</strong> unidades movidas · <strong>${items.length}</strong> cargas
      </div>
      <div class="row" style="margin-top:12px">
        <button id="sesCopy">Copiar tanda</button>
        <button class="ghost" id="sesClear">Empezar tanda nueva</button>
      </div>
    </div>`;
}
function wireSesion(){
  const c=$('#sesCopy'), l=$('#sesClear');
  if(c) c.onclick = ()=>{
    const filas = [['SKU','Producto','Tipo','Cantidad','Unidad','Lote']].concat(
      agrupar(itemsSesion()).map(x=>{const p=bySku(x.sku);return [x.sku,p?p.nombre:'',x.tipo,x.cant,p?.unidad||'un',x.lote||'']}));
    copiar(filas.map(r=>r.map(cell).join(',')).join('\n'), 'Tanda copiada');
  };
  if(l) l.onclick = ()=>{
    if(!confirm('¿Empezar una tanda nueva? Los movimientos quedan guardados, solo se limpia esta lista.')) return;
    sesion=[]; render(); toast('Tanda nueva');
  };
}

async function startScan(){
  if(typeof Html5Qrcode==='undefined'){ toast('No se pudo cargar el lector'); return; }
  const F = window.Html5QrcodeSupportedFormats || {};
  const formats = ['EAN_13','EAN_8','UPC_A','UPC_E','CODE_128','CODE_39','ITF','QR_CODE']
    .map(n=>F[n]).filter(v=>v!==undefined);
  try{
    scanner = new Html5Qrcode('reader', {formatsToSupport: formats.length?formats:undefined, verbose:false});
    await scanner.start({facingMode:'environment'}, {fps:10, qrbox:{width:260,height:150}}, onScan, ()=>{});
    scanning = true; $('#btnScan').textContent='Apagar cámara'; $('#btnScan').className='big out';
  }catch(e){
    toast('La cámara no está disponible acá');
  }
}
async function stopScan(manual){
  if(!scanner||!scanning) return;
  try{ await scanner.stop(); scanner.clear(); }catch(e){}
  scanning=false;
  const b=$('#btnScan'); if(b && manual!==undefined){ b.textContent='Encender cámara'; b.className='big in'; }
}
/* El codigo impreso trae producto (8) + lote (4). Las etiquetas viejas de 8
   digitos siguen valiendo: ahi todo el codigo es el producto y no hay lote. */
function partirCodigo(c){
  c = String(c).trim();
  // Solo se parte si son EXACTAMENTE 12 digitos: ese es el formato producto+lote.
  // Con la regla floja de "12 o mas" se rompian dos casos reales: los SKU
  // alfanumericos de envases (ENV-FR-YOL-100D) y los EAN de fabrica de 13 digitos.
  if(/^\d{12}$/.test(c)){
    const lote = c.slice(8,12);
    return {prod: c.slice(0,8), lote: lote === '0000' ? '' : lote};
  }
  return {prod: c, lote: ''};
}
function buscarPorCodigo(c){
  const {prod, lote} = partirCodigo(c);
  let p = productos.find(x=>(x.codigos||[]).includes(prod));
  if(!p) p = productos.find(x=>(x.codigos||[]).includes(String(c).trim()));   // por las dudas
  return {p, prod, lote};
}

function onScan(code){
  if(navigator.vibrate) navigator.vibrate(60);
  stopScan();
  const b=$('#btnScan'); if(b){ b.textContent='Encender cámara'; b.className='big in'; }
  const r = buscarPorCodigo(code);
  r.p ? openMov(r.p.sku, null, 'scan', r.lote) : openDesconocido(r.prod);
}

function openMov(sku, tipoIni, origen, loteLeido){

        if(base === null) return ' <span style="color:var(--rojo)">(sin confirmar con la planilla)</span>';

    </div>

      <input id="cant" type="number" inputmode="numeric" pattern="[0-9]*" value="1" min="0">
      <button id="mas" aria-label="Sumar uno">+</button>
    </div>
    <div class="chips">
      ${bulto>1?`<button class="wide" data-add="${bulto}">+1 bulto (${bulto})</button>`:''}

      <button class="clear" data-set="0">Borrar</button>
    </div>

    <label for="flote">Lote ${loteLeido?'<span style="font-weight:400">— leído de la etiqueta</span>':'<span style="font-weight:400">(4 dígitos)</span>'}</label>
    <input id="flote" inputmode="numeric" maxlength="4" value="${esc(loteLeido||'')}" placeholder="0247"

    <select id="motivo"></select>
    <label for="nota">Nota <span style="font-weight:400">(pedido, vendedora, guía…)</span></label>
    <input id="nota" placeholder="Opcional">
    <div class="row" style="margin-top:16px">
      <button class="ghost" onclick="closeSheet()">Cancelar</button>
      <button class="big out" id="guardar">Guardar salida</button>
    </div>`);

  const paint = ()=>{
    $('#tIn').setAttribute('aria-pressed', tipo==='entrada');
    $('#tOut').setAttribute('aria-pressed', tipo==='salida');
    $('#motivo').innerHTML = MOTIVOS[tipo].map(m=>`<option>${m}</option>`).join('');
    const g=$('#guardar');
    g.textContent = tipo==='entrada' ? 'Guardar entrada' : 'Guardar salida';
    g.className = 'big ' + (tipo==='entrada'?'in':'out');
  };
  $('#tIn').onclick=()=>{tipo='entrada';paint();total()};
  $('#tOut').onclick=()=>{tipo='salida';paint();total()};
  const c = $('#cant');
  if(p.unica){
    // Pieza única: la cantidad queda en 1. Antes se trababan los botones sin
    // explicar nada y parecía que la app estaba rota.
    c.value = 1; c.readOnly = true;
    const chips = document.querySelector('.chips'); if(chips) chips.remove();
    const men = $('#menos'), mas = $('#mas');
    if(men){ men.disabled = true; men.style.opacity = .3; }
    if(mas){ mas.disabled = true; mas.style.opacity = .3; }
    const aviso = document.createElement('div');
    aviso.className = 'totalbox';
    aviso.style.cssText = 'background:#E9DFF0;color:#5B3A78;padding:10px 12px;border-radius:11px;margin-top:10px';
    aviso.innerHTML = 'Está marcado como <strong>pieza única</strong>, por eso la cantidad queda en 1. ' +
      'Si en realidad hay varias iguales, destildá "Pieza única" en Productos.';
    c.closest('.stepper').after(aviso);

    if(bulto>1 && n) txt += ` · son ${(n/bulto).toFixed(n%bulto?1:0)} bultos de ${bulto}`;
    $('#tot').innerHTML = txt;

  document.querySelectorAll('[data-set]').forEach(b=> b.onclick=()=>{c.value=b.dataset.set;total();c.focus();c.select()});

    const campoLote = $('#flote');
    const lote = campoLote ? campoLote.value.trim() : '';
    if(p.lleva_lote && !lote &&
       !confirm('Este producto lleva lote y quedó vacío. ¿Guardar igual? Sin lote no se puede rastrear la partida ante un reclamo.')) return;

    const nuevo = {id:uid(), ts:Date.now(), sku:p.sku, tipo, cant, lote,
                   motivo:$('#motivo').value, nota:$('#nota').value.trim()};
    movs.unshift(nuevo);
    sesion.unshift(nuevo.id);
    await save(K_MOV, movs);
    closeSheet();
    toast(`${tipo==='entrada'?'Entrada':'Salida'} de ${cant} ${p.unidad||'un'} · ${p.nombre} · quedan ${stock(p.sku)}`);
    render();
    if(origen==='scan' && tab==='escanear') setTimeout(startScan, 350);
  };
}

function skuAuto(nombre){
  let base = nombre.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,20) || 'PROD';
  let sku = base, n = 2;
  while(bySku(sku)) sku = base+'-'+(n++);
  return sku;
}
function openDesconocido(code){
  openSheet(`
    <h2 style="margin:2px 0 6px;font-size:19px">Código nuevo</h2>
    <p class="muted" style="margin:0 0 14px">Leí <strong class="num">${esc(code)}</strong> y todavía no sé qué producto es. Decime el nombre una sola vez y los próximos escaneos lo reconocen solo.</p>

    <label for="dnNom">Nombre del producto</label>
    <input id="dnNom" placeholder="Ej: Perfume Ámbar 100ml" autocomplete="off">
    <div class="row">
      <div><label for="dnU">Unidad</label><input id="dnU" value="un"></div>
      <div><label for="dnB">Unid. por bulto</label><input id="dnB" type="number" inputmode="numeric" value="1"></div>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="big in" id="dnCrear">Crear y cargar cantidad</button>
    </div>
    <p class="muted" style="margin:10px 0 0">El SKU y la ubicación se completan después desde Productos.</p>

    <div style="border-top:1px solid var(--line);margin:16px 0 0;padding-top:14px">
      <p class="muted" style="margin:0 0 8px">¿O es un producto que ya tenés cargado, pero sin este código?</p>
      <input id="qa" placeholder="Buscar para asociarle este código" autocomplete="off">
      <div id="resa"></div>
    </div>
    <button class="link" onclick="closeSheet()" style="margin-top:10px">Cancelar</button>`);

  $('#dnCrear').onclick = async ()=>{
    const nombre = $('#dnNom').value.trim();
    if(!nombre){ toast('Escribí el nombre del producto'); return; }
    const sku = skuAuto(nombre);
    productos.push({nombre, sku, codigos:[code], unidad:$('#dnU').value.trim()||'un',
      bulto:Math.max(1,+$('#dnB').value||1), min:0, ubicacion:''});
    await save(K_PROD, productos);
    closeSheet(); toast(`${nombre} creado y asociado al código`);
    openMov(sku, 'entrada', 'scan');
  };
  setTimeout(()=>{ const i=$('#dnNom'); if(i) i.focus(); },150);

  $('#qa').oninput = e=>{
    const q=e.target.value.trim().toLowerCase(), r=$('#resa');
    if(!q){ r.innerHTML=''; return; }
    const hits = productos.filter(p=>p.nombre.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q)).slice(0,6);
    r.innerHTML = hits.map(p=>`
      <div class="item"><div class="grow"><div class="name">${esc(p.nombre)}</div><div class="sub">${esc(p.sku)}</div></div>
      <button data-link="${esc(p.sku)}">Asociar</button></div>`).join('');
    r.querySelectorAll('[data-link]').forEach(b=> b.onclick = async ()=>{
      const p = bySku(b.dataset.link);
      p.codigos = [...(p.codigos||[]), code];
      await save(K_PROD, productos);
      closeSheet(); toast(`Código asociado a ${p.nombre}`); openMov(p.sku, null, 'scan');
    });
  };
}

/* ─────────── Movimientos ─────────── */
function enPeriodo(m){
  if(movPeriodo==='todo') return true;
  const d=new Date(m.ts), h=new Date();
  if(movPeriodo==='hoy') return d.toDateString()===h.toDateString();
  return m.ts >= h.getTime() - 7*864e5;
}
function vMovs(){
  const lista = movs.filter(enPeriodo);
  const per = [['hoy','Hoy'],['semana','7 días'],['todo','Todo']];
  const vis = [['prod','Total por producto'],['cron','Uno por uno']];

  let cuerpo;
  if(!lista.length){
    cuerpo = `<p class="empty">No hay movimientos en este período.</p>`;
  }else if(movVista==='prod'){
    const skus = [...new Set(lista.map(m=>m.sku))];
    const filas = skus.map(sku=>{
      const ent = lista.filter(m=>m.sku===sku&&m.tipo==='entrada').reduce((t,m)=>t+m.cant,0);
      const sal = lista.filter(m=>m.sku===sku&&m.tipo==='salida').reduce((t,m)=>t+m.cant,0);
      return {sku, ent, sal, neto:ent-sal};
    }).sort((a,b)=> (b.ent+b.sal)-(a.ent+a.sal));
    const tEnt = filas.reduce((t,f)=>t+f.ent,0), tSal = filas.reduce((t,f)=>t+f.sal,0);
    cuerpo = filas.map(f=>{
      const p=bySku(f.sku), b=Math.max(1,+p?.bulto||1);
      return `<div class="item">
        <div class="grow"><div class="name">${esc(p?p.nombre:f.sku)}</div>
          <div class="sub">+${f.ent} entradas · −${f.sal} salidas${b>1?` · ${(Math.abs(f.neto)/b).toFixed(Math.abs(f.neto)%b?2:0)} bultos`:''} · stock ${stock(f.sku)}</div></div>
        <div class="qty" style="color:${f.neto<0?'var(--salida)':'var(--entrada)'}">${f.neto>0?'+':f.neto<0?'−':''}${Math.abs(f.neto)}</div>
      </div>`}).join('') + `
      <div class="totalbox" style="border-top:1px solid var(--line);padding-top:11px">
        <strong>${filas.length}</strong> productos · entradas <strong>+${tEnt}</strong> · salidas <strong>−${tSal}</strong> · neto <strong>${tEnt-tSal>0?'+':''}${tEnt-tSal}</strong>
      </div>`;
  }else{
    cuerpo = lista.slice(0,80).map(m=>{
      const p=bySku(m.sku), d=fecha(m.ts);
      const col=m.tipo==='entrada'?'var(--entrada)':'var(--salida)';
      return `<div class="item">
        <div class="grow"><div class="name">${esc(p?p.nombre:m.sku)}</div>
          <div class="sub">${d.f} ${d.h}${m.lote?` · lote ${esc(m.lote)}`:''} · ${esc(m.motivo)}${m.nota?' · '+esc(m.nota):''}</div></div>
        <div class="qty" style="color:${col}">${m.tipo==='entrada'?'+':'−'}${m.cant}</div>
        <button class="link danger" data-del="${m.id}">Anular</button>
      </div>`}).join('');
  }

  $('#view').innerHTML = `
    <div class="panel">
      <div class="chips" style="margin:0 0 10px">
        ${per.map(([v,t])=>`<button data-per="${v}" ${movPeriodo===v?'style="background:var(--ink);color:#fff;border-color:var(--ink)"':''}>${t}</button>`).join('')}
      </div>
      <div class="seg">
        ${vis.map(([v,t])=>`<button data-vis="${v}" class="in" aria-pressed="${movVista===v}">${t}</button>`).join('')}
      </div>
    </div>
    <div class="panel">${cuerpo}</div>`;

  $('#view').querySelectorAll('[data-per]').forEach(b=> b.onclick=()=>{movPeriodo=b.dataset.per;render()});
  $('#view').querySelectorAll('[data-vis]').forEach(b=> b.onclick=()=>{movVista=b.dataset.vis;render()});
  $('#view').querySelectorAll('[data-del]').forEach(b=> b.onclick = async ()=>{
    if(!confirm('¿Anular este movimiento? Se borra del historial.')) return;
    movs = movs.filter(m=>m.id!==b.dataset.del);
    sesion = sesion.filter(id=>id!==b.dataset.del);
    await save(K_MOV, movs); toast('Movimiento anulado'); render();
  });
}

      <button class="big in" id="fG">Guardar producto</button>
    </div>
    ${p?`<button class="link danger" id="fD" style="margin-top:8px">Borrar producto y sus movimientos</button>`:''}`);

  // foto: previsualizacion y captura
  let fotoNueva = null, fotoBorrar = false;
  const pintarFoto = async ()=>{
    const z = $('#fotoZona'); if(!z) return;
    const actual = fotoNueva || (p && !fotoBorrar ? await traerFoto(p.sku) : null);
    z.innerHTML = actual
      ? `<img class="fotogrande" src="${actual}" alt="">
         <div class="row" style="margin-top:9px">
           <button type="button" id="fCambiar">Cambiar foto</button>
           <button type="button" class="ghost" id="fQuitar">Quitar</button>
         </div>`
      : `<div class="row"><button type="button" class="big in" id="fCambiar">Sacar o elegir foto</button></div>`;
    $('#fCambiar').onclick = ()=> $('#fFile').click();
    const q = $('#fQuitar');
    if(q) q.onclick = ()=>{ fotoNueva=null; fotoBorrar=true; pintarFoto(); };
  };
  $('#fFile').onchange = async e=>{
    const f = e.target.files && e.target.files[0]; if(!f) return;
    toast('Procesando foto…');
    try{ fotoNueva = await reducir(f, 700); fotoBorrar = false; pintarFoto(); }
    catch(err){ toast('No se pudo procesar la imagen'); }
    e.target.value = '';
  };
  pintarFoto();

  $('#fG').onclick = async ()=>{
    const nombre=$('#fN').value.trim(), nsku=$('#fS').value.trim();
    if(!nombre||!nsku){ toast('Nombre y SKU son obligatorios'); return; }
    if(!p && bySku(nsku)){ toast('Ese SKU ya existe'); return; }
    const codigos = $('#fC').value.split(',').map(s=>s.trim()).filter(Boolean);
    const unica = $('#fUni').checked;
    const datos = {nombre, sku:nsku, codigos, unidad:$('#fU').value.trim()||'un',
      bulto: unica ? 1 : Math.max(1,+$('#fB').value||1), min:+$('#fM').value||0,
      ubicacion:$('#fL').value.trim(), unica, lleva_lote:$('#fLot').checked};
    if(p){
      const viejo = p.sku;
      Object.assign(p, datos);
      if(viejo!==nsku) movs.forEach(m=>{ if(m.sku===viejo) m.sku=nsku; });
      await save(K_MOV, movs);
    }else{
      productos.push(datos);
      const ini = +$('#fI').value||0;
      if(ini>0){ movs.unshift({id:uid(), ts:Date.now(), sku:nsku, tipo:'entrada', cant:ini, motivo:'Carga inicial', nota:''}); await save(K_MOV, movs); }
    }
    await save(K_PROD, productos);

    if(fotoNueva){
      await guardarFoto(nsku, fotoNueva);
      const reg = bySku(nsku); if(reg) reg.fotoSync = false;
    }else if(p && fotoBorrar){
      await borrarFoto(p.sku);
    }else if(p && p.sku !== nsku){
      const vieja = await traerFoto(p.sku);                  // el SKU cambio: la foto lo sigue
      if(vieja){ await guardarFoto(nsku, vieja); await borrarFoto(p.sku); }
    }
    await save(K_PROD, productos);
    closeSheet(); toast('Producto guardado'); render();
  };
  if(p) $('#fD').onclick = async ()=>{
    if(!confirm(`¿Borrar ${p.nombre} y todos sus movimientos?`)) return;
    productos = productos.filter(x=>x.sku!==p.sku);
    movs = movs.filter(m=>m.sku!==p.sku);
    await borrarFoto(p.sku);
    await save(K_PROD, productos); await save(K_MOV, movs);
    closeSheet(); toast('Producto borrado'); render();
  };
}

function openImport(){
  openSheet(`
    <h2 style="margin:2px 0 6px;font-size:19px">Pegar listado</h2>
    <p class="muted" style="margin:0 0 10px">Una fila por producto, con este orden de columnas (podés copiar directo de Sheets):</p>
    <p class="muted" style="margin:0 0 10px"><strong>SKU · Nombre · Código de barras · Unidad · Unid. por bulto · Stock mínimo · Ubicación · Stock actual</strong></p>
    <textarea id="imTxt" style="min-height:150px" placeholder="PF-001&#9;Perfume Ámbar 100ml&#9;7791234567890&#9;un&#9;12&#9;24&#9;Rack A2&#9;480"></textarea>
    <div class="row" style="margin-top:14px">
      <button class="ghost" onclick="closeSheet()">Cancelar</button>
      <button class="big in" id="imGo">Importar</button>
    </div>`);
  $('#imGo').onclick = async ()=>{
    const lineas = $('#imTxt').value.split('\n').map(l=>l.trim()).filter(Boolean);
    let nuevos=0, salteados=0;
    for(const l of lineas){
      const c = l.split(/\t|;|,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(s=>s.trim().replace(/^"|"$/g,''));
      const [sku,nombre,cod,unidad,blt,min,ubic,stk] = c;
      if(!sku||!nombre||/^sku$/i.test(sku)){ salteados++; continue; }
      if(bySku(sku)){ salteados++; continue; }
      productos.push({nombre, sku, codigos:cod?[cod]:[], unidad:unidad||'un',
        bulto:Math.max(1,+blt||1), min:+min||0, ubicacion:ubic||''});
      const ini = +stk||0;
      if(ini>0) movs.unshift({id:uid(), ts:Date.now(), sku, tipo:'entrada', cant:ini, motivo:'Carga inicial', nota:'Importado'});
      nuevos++;
    }
    await save(K_PROD, productos); await save(K_MOV, movs);
    closeSheet(); toast(`${nuevos} productos importados${salteados?`, ${salteados} salteados`:''}`); render();
  };
}


/* ─────────── Conexión con Google Sheets ─────────── */
function pendientes(){ return movs.filter(m=>!m.sync); }

function fotosPendientes(){
  return productos.filter(p=>fotoCache[p.sku] && p.fotoSync !== true);
}

async function subirFotos(){
  const lista = fotosPendientes();
  if(!lista.length){ toast('No hay fotos pendientes'); return; }
  let ok = 0, fallo = 0, motivo = '';
  for(let i=0; i<lista.length; i++){
    const p = lista[i];
    toast(`Subiendo foto ${i+1} de ${lista.length}…`);
    try{
      const dataUrl = fotoCache[p.sku] || await traerFoto(p.sku);
      if(!dataUrl){ fallo++; continue; }
      const r = await pedir({action:'foto'}, {
        sku: p.sku,
        nombre: p.nombre,
        base64: dataUrl.split(',')[1]              // sin el prefijo data:image/jpeg
      });
      if(r.ok){ p.fotoSync = true; ok++; }
      else { fallo++; motivo = motivo || (r.error || 'sin detalle'); }
    }catch(e){ fallo++; motivo = motivo || e.message; }
  }
  await save(K_PROD, productos);
  if(fallo && motivo){
    openSheet(`
      <h2 style="margin:2px 0 8px;font-size:19px">No se pudieron subir ${fallo} ${fallo===1?'foto':'fotos'}</h2>
      <p class="muted" style="margin:0 0 6px">Esto contestó la planilla:</p>
      <div class="totalbox" style="margin:0;word-break:break-word">${esc(motivo)}</div>
      <p class="muted" style="margin:12px 0 0">Si dice que el SKU no está en PARAMETROS, agregá esa fila en la planilla y volvé a intentar.</p>
      <div class="row" style="margin-top:14px"><button class="big in" onclick="closeSheet()">Entendido</button></div>`);
  }else{
    toast(`${ok} fotos en la planilla`);
  }
  render();
}

function vSheets(){
  const pend = pendientes().length;
  const u = cfg.ultima ? fecha(cfg.ultima) : null;
  $('#view').innerHTML = `
    <div class="panel">
      <h2>Movimientos por subir</h2>
      <div class="totalbox" style="margin:0">
        <strong>${pend}</strong> movimientos sin subir${u?` · última subida ${u.f} ${u.h}`:''}
      </div>
      <div class="row" style="margin-top:12px">
        <button class="big in" id="push" ${cfg.url?'':'disabled style="opacity:.45"'}>Subir a Sheets</button>
      </div>
      <button class="link" id="pull" ${cfg.url?'':'style="opacity:.45;pointer-events:none"'}>Traer productos y stock desde Sheets</button>
    </div>

    <div class="panel">
      <h2>Fotos por subir</h2>
      <div class="totalbox" style="margin:0">
        <strong>${fotosPendientes().length}</strong> fotos sin subir a Drive
      </div>
      <div class="row" style="margin-top:12px">
        <button id="pushFotos" ${cfg.url?'':'disabled style="opacity:.45"'}>Subir fotos</button>
      </div>
      <p class="muted" style="margin:10px 0 0">Cada foto pesa unos 70 KB. Conviene subirlas con wifi y no en la calle.</p>
    </div>

    <div class="panel">
      <h2>Conexión</h2>
      <label for="cU">Dirección del Web App</label>
      <input id="cU" value="${esc(cfg.url)}" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
      <label for="cT">Clave</label>
      <input id="cT" value="${esc(cfg.token)}" placeholder="La misma que pusiste en el script" autocomplete="off">
      <div class="row" style="margin-top:14px">
        <button id="cG">Guardar conexión</button>
        <button class="ghost" id="cP" ${cfg.url?'':'disabled style="opacity:.45"'}>Probar</button>
      </div>
      <p class="muted" style="margin:10px 0 0">Mientras no haya conexión configurada, seguí usando los botones de copiar y pegar en la planilla. Los movimientos no se pierden: quedan como pendientes hasta que los subas.</p>
    </div>

    <div class="panel">
      <h2>Copiar y pegar</h2>
      <div class="row"><button id="expStock2">Copiar stock</button><button id="expMovs2">Copiar movimientos</button></div>
    </div>`;

  $('#cG').onclick = async ()=>{
    cfg.url = $('#cU').value.trim(); cfg.token = $('#cT').value.trim();
    await save(K_CFG, cfg); toast('Conexión guardada'); render();
  };
  const p = $('#cP'); if(p) p.onclick = probar;
  const b = $('#push'); if(b) b.onclick = subir;
  const bf = $('#pushFotos'); if(bf) bf.onclick = subirFotos;
  const l = $('#pull'); if(l) l.onclick = bajar;
  $('#expStock2').onclick = ()=> copiar(csvStock(), 'Stock copiado');
  $('#expMovs2').onclick = ()=> copiar(csvMovs(), 'Movimientos copiados');
}

async function pedir(params, body){
  const url = cfg.url + (cfg.url.includes('?')?'&':'?') + new URLSearchParams({token:cfg.token, ...params});
  const opt = body
    ? {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body), redirect:'follow'}
    : {method:'GET', redirect:'follow'};
  const r = await fetch(url, opt);
  const txt = await r.text();
  try{ return JSON.parse(txt); }
  catch(e){ throw new Error('Respuesta inesperada del script'); }
}

async function probar(){
  toast('Probando…');
  try{
    const r = await pedir({action:'ping'});
    toast(r.ok ? `Conectado a "${r.planilla}"` : 'El script respondió: '+(r.error||'error'));
  }catch(e){ toast('No se pudo conectar. Revisá la dirección y la clave.'); }
}

async function traerStock(silencioso){
  try{
    const r = await pedir({action:'stock'});
    if(!r.ok) throw new Error(r.error||'error');
    stockBase = {ts: Date.now(), datos: r.stock || {}};
    await save(K_STOCK, stockBase);
    if(!silencioso) toast(`Stock actualizado: ${Object.keys(stockBase.datos).length} productos`);
    return true;
  }catch(e){
    if(!silencioso) toast('No se pudo traer el stock: '+e.message);
    return false;
  }
}

async function bajar(){
  if(!confirm('Trae los productos y el stock desde la planilla. Se actualizan los que ya tenés y se agregan los nuevos. No borra nada de lo cargado en el teléfono.')) return;
  toast('Actualizando…');
  try{
    const r = await pedir({action:'productos'});
    if(!r.ok) throw new Error(r.error||'error');
    let nuevos=0, act=0;
    r.productos.forEach(x=>{
      if(!x.sku || !x.nombre) return;
      const ex = bySku(x.sku);
      if(ex){
        ex.nombre=x.nombre; ex.unidad=x.unidad||ex.unidad; ex.bulto=Math.max(1,+x.bulto||1);
        ex.min=+x.min||0; ex.ubicacion=x.ubicacion||ex.ubicacion;
        if(x.unica !== undefined) ex.unica = !!x.unica;
        if(x.lleva_lote !== undefined) ex.lleva_lote = !!x.lleva_lote;
        if(x.codigo && !(ex.codigos||[]).includes(x.codigo)) ex.codigos=[...(ex.codigos||[]), x.codigo];
        act++;
      }else{
        productos.push({sku:x.sku, nombre:x.nombre, codigos:x.codigo?[String(x.codigo)]:[],
          unidad:x.unidad||'un', bulto:Math.max(1,+x.bulto||1), min:+x.min||0,
          ubicacion:x.ubicacion||'', unica:!!x.unica, lleva_lote:!!x.lleva_lote});
        nuevos++;
      }
    });
    await save(K_PROD, productos);
    await traerStock(true);
    toast(`${nuevos} nuevos · ${act} actualizados · stock al día`); render();
  }catch(e){ toast('No se pudieron traer los productos: '+e.message); }
}

async function subir(){
  const pend = pendientes();
  if(!pend.length){ toast('No hay nada pendiente'); return; }
  toast(`Subiendo ${pend.length}…`);
  const lote = pend.map(m=>{
    const p=bySku(m.sku), d=fecha(m.ts);
    return {id:m.id, fecha:d.f, hora:d.h, sku:m.sku, producto:p?p.nombre:'', tipo:m.tipo,
            cantidad:m.cant, motivo:m.motivo, nota:m.nota||'', lote:m.lote||''};
  });
  try{
    const r = await pedir({action:'movimientos'}, {movimientos:lote});
    if(!r.ok) throw new Error(r.error||'error');
    const ok = new Set(r.guardados||lote.map(x=>x.id));
    movs.forEach(m=>{ if(ok.has(m.id)) m.sync = true; });
    cfg.ultima = Date.now();
    await save(K_MOV, movs); await save(K_CFG, cfg);
    await traerStock(true);                       // ya estan en la planilla: refrescamos la base
    toast(`${ok.size} movimientos en la planilla`); render();
  }catch(e){
    toast('No se pudo subir. Quedan pendientes, probá de nuevo con señal.');
  }
}

/* ─────────── Exportar ─────────── */
const cell = v => /[",;\t\n]/.test(String(v??'')) ? `"${String(v).replace(/"/g,'""')}"` : String(v??'');
function csvStock(){
  const h=['SKU','Producto','Ubicacion','Unidad','Stock','Unid x bulto','Bultos','Minimo','Estado'];
  return [h, ...productos.map(p=>{const e=estado(p), b=Math.max(1,+p.bulto||1);
    return [p.sku,p.nombre,p.ubicacion,p.unidad,e.s,b,(e.s/b).toFixed(b>1?2:0),p.min||0,e.txt]})]
    .map(r=>r.map(cell).join(',')).join('\n');
}
function csvMovs(){
  const h=['Fecha','Hora','SKU','Producto','Tipo','Cantidad','Motivo','Nota','Lote'];
  return [h, ...movs.map(m=>{const p=bySku(m.sku), d=fecha(m.ts);
    return [d.f,d.h,m.sku,p?p.nombre:'',m.tipo,m.cant,m.motivo,m.nota,m.lote||'']})]
    .map(r=>r.map(cell).join(',')).join('\n');
}
async function copiar(txt,ok){
  try{ await navigator.clipboard.writeText(txt); toast(ok); }
  catch(e){
    const t=document.createElement('textarea'); t.value=txt; document.body.appendChild(t);
    t.select(); document.execCommand('copy'); t.remove(); toast(ok);
  }
}
